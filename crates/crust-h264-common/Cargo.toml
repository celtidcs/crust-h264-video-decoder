[package]
name = "crust-h264-common"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
# Mata Network es el autor original (rusty_h264 0.16.0); las correcciones posteriores son de celtidcs.
authors = ["Mata Network", "celtidcs"]
license = "BSD-2-Clause"
description = "Primitivas del decodificador H.264 crust-h264-video-decoder: lectura de bits, Exp-Golomb, NAL/Annex-B, transformadas, predicción intra, compensación de movimiento y desbloqueo. Sin unsafe propio. Derivado de rusty_h264-common 0.16.0."
repository = "https://github.com/celtidcs/crust-h264-video-decoder"
documentation = "https://docs.rs/crust-h264-common"
readme = "README.md"
keywords = ["h264", "avc", "video", "codec", "bitstream"]
categories = ["multimedia::video", "multimedia::encoding", "encoding"]
build = "build.rs"

[lib]
name = "crust_h264_common"
path = "src/lib.rs"

[features]
# Por defecto solo `std`. `asm` (núcleos SIMD de `rusty_h264-accel`, con intrínsecos `unsafe`) y
# `global-alloc` (instala `rusty_alloc-api` como asignador global del proceso) quedan fuera del
# conjunto por defecto: quien los quiera debe pedirlos expresamente.
default = ["std"]
std = []
asm = ["dep:rusty_h264-accel"]
global-alloc = ["dep:rusty_alloc-api"]
libm = ["dep:libm"]

[dependencies]
bytemuck = "1"
libm = { version = "0.2", optional = true }
once_cell = { version = "1", default-features = false, features = ["race", "alloc"] }
rusty_alloc-api = { version = "=1.1.6", optional = true }
rusty_h264-accel = { version = "0.16.0", optional = true }
wide = { version = "0.7", default-features = false }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }

[[example]]
name = "bs_layout_ceiling"
path = "examples/bs_layout_ceiling.rs"
